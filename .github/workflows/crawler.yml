name: Get Hot News

on:
  schedule:
    # 每小时第 5 分：爬取并刷新 GitHub Pages 实时热榜（不发邮件）
    - cron: "5 * * * *"
    # 北京时间 09:33：发送「每日汇总」邮件（report.mode = daily）
    - cron: "33 9 * * *"
    # 北京时间 20:33：发送「增量」邮件（仅当有新匹配新闻，report.mode = incremental）
    - cron: "33 20 * * *"

  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      # --------------------------------------------------------------------------------
      # 🚦 TRAFFIC CONTROL / 流量控制
      # --------------------------------------------------------------------------------
      # EN: Generates a random delay between 1 and 300 seconds (5 minutes).
      #     Critical for load balancing.
      #
      # CN: 生成 1 到 300 秒（5分钟）之间的随机延迟。
      #     这对负载均衡至关重要。
      - name: Random Delay (Traffic Control)
        if: success()
        run: |
          echo "🎲 Traffic Control: Generating random delay..."
          DELAY=$(( ( RANDOM % 300 )  + 1 ))
          echo "⏸️  Sleeping for ${DELAY} seconds to spread the load..."
          sleep ${DELAY}s
          echo "▶️  Delay finished. Starting crawler..."

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        if: success()
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      # --------------------------------------------------------------------------------
      # 🕘 按调度时间切换报告模式与通知开关
      #     - 09:33 触发 -> daily（每日汇总）+ 发邮件
      #     - 20:33 触发 -> incremental（仅新匹配新闻）+ 发邮件
      #     - 每小时 :05 触发 -> 关闭通知，只刷新 GitHub Pages
      #     - 手动触发 (workflow_dispatch) -> daily + 发邮件（便于验证）
      # 说明：用 github.event.schedule 判断，即使 GitHub 延迟执行也能准确识别触发来源。
      # --------------------------------------------------------------------------------
      - name: 根据调度设置推送模式
        if: success()
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="daily"; NOTIFY="true"
          else
            case "$SCHEDULE" in
              "33 9 * * *")  MODE="daily";       NOTIFY="true" ;;
              "33 20 * * *") MODE="incremental"; NOTIFY="true" ;;
              *)             MODE="incremental"; NOTIFY="false" ;;
            esac
          fi
          echo "调度表达式: $SCHEDULE"
          echo "报告模式: $MODE | 通知: $NOTIFY"
          sed -i "s/^\(  mode: \).*/\1\"$MODE\"/" config/config.yaml
          sed -i "s/^\(  enable_notification: \).*/\1$NOTIFY/" config/config.yaml
          echo "--- 校验 config.yaml 关键字段 ---"
          grep -nE '^  mode:|^  enable_notification:' config/config.yaml

      - name: Run crawler
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STORAGE_BACKEND: auto
          LOCAL_RETENTION_DAYS: ${{ secrets.LOCAL_RETENTION_DAYS }}
          REMOTE_RETENTION_DAYS: ${{ secrets.REMOTE_RETENTION_DAYS }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: python -m trendradar

      # --------------------------------------------------------------------------------
      # 📄 提交 HTML 报告到仓库，供 GitHub Pages 展示实时热榜
      # --------------------------------------------------------------------------------
      - name: Commit report to repository
        if: success()
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          SRC=$(find output -maxdepth 1 -name "*.html" 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            echo "ℹ️ 未生成 HTML 报告，跳过提交"
            exit 0
          fi
          cp "$SRC" index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "ℹ️ 报告无变化，跳过提交"
          else
            git commit -m "chore: 更新每日热点报告 [skip ci]"
            git push
            echo "✅ 已更新 index.html，GitHub Pages 将在 1-2 分钟内刷新"
          fi
