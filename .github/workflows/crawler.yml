name: Get Hot News

on:
  schedule:
    # 每 3 小时刷新一次 GitHub Pages 实时热榜
    #   cron 表达式按 UTC：北京时间 = UTC+8，故 "5 1-22/3" 对应北京时间
    #   00:05 / 03:05 / 06:05 / 09:05 / 12:05 / 15:05 / 18:05 / 21:05（每 3 小时一班）
    - cron: "5 1-22/3 * * *"
    # 每日邮件：北京时间 07:00 与 20:00 各发送一封每日汇总
    #   UTC 23:00 = 北京时间 07:00（次日）；UTC 12:00 = 北京时间 20:00
    - cron: "0 12,23 * * *"

  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      # --------------------------------------------------------------------------------
      # 🚦 TRAFFIC CONTROL / 流量控制
      # --------------------------------------------------------------------------------
      - name: Random Delay (Traffic Control)
        if: success()
        run: |
          echo "🎲 Traffic Control: Generating random delay..."
          DELAY=$(( ( RANDOM % 300 )  + 1 ))
          echo "⏸️  Sleeping for ${DELAY} seconds to spread the load..."
          sleep ${DELAY}s
          echo "▶️  Delay finished. Starting crawler..."

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        if: success()
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      # --------------------------------------------------------------------------------
      # 🕘 计算「本次是否发邮件」+ 报告模式
      #    策略：
      #      - 每 3 小时班次 -> 仅刷新 Pages（incremental 模式，不发邮件）
      #      - 北京时间 07:00 / 20:00 班次 -> 发送每日汇总邮件（daily 模式）
      #      - 手动触发 -> 发送每日汇总邮件（daily 模式）
      #    节流：email_sent.txt 记录 "sent:日期:时段"，同一时段当天不重复发送
      #    通过工作区文件 .should_email / .report_mode / .report_slot 在 step 间可靠传递（比 GITHUB_ENV 更稳）
      # --------------------------------------------------------------------------------
      - name: 计算发送标志与报告模式
        id: setmode
        if: success()
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          export TZ=Asia/Shanghai
          # 当前(北京)小时，转成无前导零数字，规避 "07" != "7" 这类比较陷阱
          NOW_H=$(date +%H)
          NOW_H=$((10#$NOW_H))
          TODAY=$(date +%Y-%m-%d)
          SLOT=""
          # 小时窗口(宽松)：GitHub cron 实测延迟 9~78 分钟，极端可超 2 小时，
          # 故窗口留足冗余，并让窗口内的「每 3 小时 Pages 班」自动成为补发机会：
          #   早报窗口: 07:00-11:59 (北京) —— 邮件专班 07:00 + Pages 班 09:05 兜底
          #   晚报窗口: 20:00-23:59 (北京) —— 邮件专班 20:00 + Pages 班 21:05 兜底
          # 是否真发由 email_sent.txt 节流决定：该时段当天已发过则跳过，绝不重复。
          if [ "$NOW_H" -ge 7 ] && [ "$NOW_H" -le 11 ]; then SLOT="morning"; fi
          if [ "$NOW_H" -ge 20 ] && [ "$NOW_H" -le 23 ]; then SLOT="evening"; fi
          MODE="incremental"; SHOULD_EMAIL="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="daily"; SHOULD_EMAIL="true"; SLOT="manual"
          elif [ -n "$SLOT" ]; then
            if ! grep -qxF "sent:${TODAY}:${SLOT}" email_sent.txt 2>/dev/null; then
              MODE="daily"; SHOULD_EMAIL="true"
            fi
          fi
          echo "$MODE" > .report_mode
          echo "$SHOULD_EMAIL" > .should_email
          echo "$SLOT" > .report_slot
          echo "调度表达式: $SCHEDULE"
          echo "当前(北京)小时: $NOW_H | 时段: ${SLOT:-无} | 今天: $TODAY"
          echo "报告模式: $MODE | 是否发邮件: $SHOULD_EMAIL"
          sed -i "s/^\(  mode: \).*/\1\"$MODE\"/" config/config.yaml
          echo "--- 校验 config.yaml 关键字段 ---"
          grep -nE '^  mode:' config/config.yaml

      - name: Run crawler
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STORAGE_BACKEND: auto
          LOCAL_RETENTION_DAYS: ${{ secrets.LOCAL_RETENTION_DAYS }}
          REMOTE_RETENTION_DAYS: ${{ secrets.REMOTE_RETENTION_DAYS }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: |
          SHOULD_EMAIL=$(cat .should_email 2>/dev/null || echo false)
          if [ "$SHOULD_EMAIL" = "true" ]; then
            echo "📧 本次将发送邮件通知"
            export EMAIL_FROM="${{ secrets.EMAIL_FROM }}"
            export EMAIL_PASSWORD="${{ secrets.EMAIL_PASSWORD }}"
            export EMAIL_TO="${{ secrets.EMAIL_TO }}"
            export EMAIL_SMTP_SERVER="${{ secrets.EMAIL_SMTP_SERVER }}"
            export EMAIL_SMTP_PORT="${{ secrets.EMAIL_SMTP_PORT }}"
          else
            echo "ℹ️ 本次仅刷新 Pages，不发送邮件"
          fi
          python -m trendradar 2>&1 | tee crawler_run.log
          # 发信结果检测：senders.py 会静默吞掉 SMTP 报错，run 仍 success，
          # 需从日志里反推是否真的发出去了
          if [ "$SHOULD_EMAIL" = "true" ]; then
            if grep -q "邮件发送成功" crawler_run.log; then
              rm -f email_failed.txt
              echo "📧 发信成功（日志已确认）"
            else
              {
                echo "发信失败 @ $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S (Asia/Shanghai)')"
                echo "run 显示 success，但未检测到『邮件发送成功』日志，疑似 SMTP/授权码失败（被 senders.py 静默吞掉）"
                echo "SHOULD_EMAIL=$SHOULD_EMAIL"
              } > email_failed.txt
              echo "⚠️ 未检测到发信成功日志，已写 email_failed.txt 标记"
            fi
          fi
          rm -f crawler_run.log

      # --------------------------------------------------------------------------------
      # 📛 提交发信失败标记（若有）—— senders.py 静默吞错，靠此标记暴露失败
      # --------------------------------------------------------------------------------
      - name: 提交发信失败标记
        if: success()
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          if [ -f email_failed.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add email_failed.txt
            git commit -m "chore: 发信失败标记 [skip ci]" || true
            git push || true
            echo "⚠️ 已提交 email_failed.txt，请检查发信配置"
          else
            echo "✅ 本次无发信失败标记"
          fi

      # --------------------------------------------------------------------------------
      # 📄 提交 HTML 报告到仓库，供 GitHub Pages 展示实时热榜
      #    报告实际路径：output/html/latest/{mode}.html（如 daily.html / incremental.html）
      # --------------------------------------------------------------------------------
      - name: Commit report to repository
        if: success()
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          export TZ=Asia/Shanghai
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ---- (1) 报告 -> index.html ----
          SRC=$(find output/html/latest -maxdepth 1 -name "*.html" 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            SRC=$(find output -name "*.html" 2>/dev/null | head -1)
          fi
          if [ -n "$SRC" ]; then
            echo "📄 找到报告: $SRC"
            cp "$SRC" index.html
            git add index.html
          else
            echo "ℹ️ 未生成 HTML 报告，本次不更新 index.html"
          fi

          # ---- (2) 邮件时段记录（与报告合并进同一个 commit）----
          # 合并提交的原因：两次 push 会触发两次 GitHub Pages 构建，
          # 前一次被后一次取消（表现为 pages build 出现 cancelled），纯属浪费。
          SHOULD_EMAIL=$(cat .should_email 2>/dev/null || echo false)
          if [ "$SHOULD_EMAIL" = "true" ]; then
            # 复用 setmode 步确定的时段，保证两处一致(避免跨整点时差导致记录错位)
            SLOT=$(cat .report_slot 2>/dev/null || echo "")
            if [ -z "$SLOT" ]; then SLOT="manual"; fi
            echo "sent:$(date +%Y-%m-%d):${SLOT}" >> email_sent.txt
            # 只保留最近 14 天 + 去重，避免文件无限增长
            CUTOFF=$(date -d "14 days ago" +%Y-%m-%d)
            awk -F: -v c="$CUTOFF" 'NF>=3 && $2>=c' email_sent.txt \
              | awk '!seen[$0]++' > email_sent.new
            if [ -s email_sent.new ]; then mv email_sent.new email_sent.txt; else rm -f email_sent.new; fi
            git add email_sent.txt
            echo "📧 已记录邮件发送: $(date +%Y-%m-%d) / ${SLOT}"
          fi

          # ---- (3) 一次性提交 ----
          if git diff --cached --quiet; then
            echo "ℹ️ 无变化，跳过提交"
          else
            git commit -m "chore: 更新热点报告 [skip ci]"
            git push
            echo "✅ 已提交，GitHub Pages 将在 1-2 分钟内刷新"
          fi
