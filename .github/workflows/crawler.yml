name: Get Hot News

on:
  schedule:
    # 每 3 小时刷新一次 GitHub Pages 实时热榜
    #   cron 表达式按 UTC：北京时间 = UTC+8，故 "5 1-22/3" 对应北京时间
    #   00:05 / 03:05 / 06:05 / 09:05 / 12:05 / 15:05 / 18:05 / 21:05（每 3 小时一班）
    - cron: "5 1-22/3 * * *"
    # 每日邮件：北京时间 07:00 与 20:00 各发送一封每日汇总
    #   UTC 23:00 = 北京时间 07:00（次日）；UTC 12:00 = 北京时间 20:00
    - cron: "0 12,23 * * *"

  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      # --------------------------------------------------------------------------------
      # 🚦 TRAFFIC CONTROL / 流量控制
      # --------------------------------------------------------------------------------
      - name: Random Delay (Traffic Control)
        if: success()
        run: |
          echo "🎲 Traffic Control: Generating random delay..."
          DELAY=$(( ( RANDOM % 300 )  + 1 ))
          echo "⏸️  Sleeping for ${DELAY} seconds to spread the load..."
          sleep ${DELAY}s
          echo "▶️  Delay finished. Starting crawler..."

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        if: success()
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      # --------------------------------------------------------------------------------
      # 🕘 计算「本次是否发邮件」+ 报告模式
      #    策略：
      #      - 每 3 小时班次 -> 仅刷新 Pages（incremental 模式，不发邮件）
      #      - 北京时间 07:00 / 20:00 班次 -> 发送每日汇总邮件（daily 模式）
      #      - 手动触发 -> 发送每日汇总邮件（daily 模式）
      #    节流：email_sent.txt 记录 "sent:日期:时段"，同一时段当天不重复发送
      #    通过工作区文件 .should_email / .report_mode 在 step 间可靠传递（比 GITHUB_ENV 更稳）
      # --------------------------------------------------------------------------------
      - name: 计算发送标志与报告模式
        id: setmode
        if: success()
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          TZ=Asia/Shanghai
          NOW_H=$(date +%H)
          TODAY=$(date +%Y-%m-%d)
          SLOT=""
          if [ "$NOW_H" = "7"  ]; then SLOT="morning"; fi
          if [ "$NOW_H" = "20" ]; then SLOT="evening"; fi
          MODE="incremental"; SHOULD_EMAIL="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="daily"; SHOULD_EMAIL="true"
          elif [ -n "$SLOT" ]; then
            if ! grep -qxF "sent:${TODAY}:${SLOT}" email_sent.txt 2>/dev/null; then
              MODE="daily"; SHOULD_EMAIL="true"
            fi
          fi
          echo "$MODE" > .report_mode
          echo "$SHOULD_EMAIL" > .should_email
          echo "调度表达式: $SCHEDULE"
          echo "当前(北京)小时: $NOW_H | 时段: ${SLOT:-无} | 今天: $TODAY"
          echo "报告模式: $MODE | 是否发邮件: $SHOULD_EMAIL"
          sed -i "s/^\(  mode: \).*/\1\"$MODE\"/" config/config.yaml
          echo "--- 校验 config.yaml 关键字段 ---"
          grep -nE '^  mode:' config/config.yaml

      - name: Run crawler
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STORAGE_BACKEND: auto
          LOCAL_RETENTION_DAYS: ${{ secrets.LOCAL_RETENTION_DAYS }}
          REMOTE_RETENTION_DAYS: ${{ secrets.REMOTE_RETENTION_DAYS }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: |
          SHOULD_EMAIL=$(cat .should_email 2>/dev/null || echo false)
          if [ "$SHOULD_EMAIL" = "true" ]; then
            echo "📧 本次将发送邮件通知"
            export EMAIL_FROM="${{ secrets.EMAIL_FROM }}"
            export EMAIL_PASSWORD="${{ secrets.EMAIL_PASSWORD }}"
            export EMAIL_TO="${{ secrets.EMAIL_TO }}"
            export EMAIL_SMTP_SERVER="${{ secrets.EMAIL_SMTP_SERVER }}"
            export EMAIL_SMTP_PORT="${{ secrets.EMAIL_SMTP_PORT }}"
          else
            echo "ℹ️ 本次仅刷新 Pages，不发送邮件"
          fi
          python -m trendradar 2>&1

      # --------------------------------------------------------------------------------
      # 📄 提交 HTML 报告到仓库，供 GitHub Pages 展示实时热榜
      #    报告实际路径：output/html/latest/{mode}.html（如 daily.html / incremental.html）
      # --------------------------------------------------------------------------------
      - name: Commit report to repository
        if: success()
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          SRC=$(find output/html/latest -maxdepth 1 -name "*.html" 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            SRC=$(find output -name "*.html" 2>/dev/null | head -1)
          fi
          if [ -z "$SRC" ]; then
            echo "ℹ️ 未生成 HTML 报告，跳过提交"
            exit 0
          fi
          echo "📄 找到报告: $SRC"
          cp "$SRC" index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "ℹ️ 报告无变化，跳过提交"
          else
            git commit -m "chore: 更新热点报告 [skip ci]"
            git push
            echo "✅ 已更新 index.html，GitHub Pages 将在 1-2 分钟内刷新"
          fi
          # 若本次发送了邮件，记录时段，避免当天重复发送
          SHOULD_EMAIL=$(cat .should_email 2>/dev/null || echo false)
          if [ "$SHOULD_EMAIL" = "true" ]; then
            TZ=Asia/Shanghai
            SLOT="manual"
            NOW_H=$(date +%H)
            if [ "$NOW_H" = "7"  ]; then SLOT="morning"; fi
            if [ "$NOW_H" = "20" ]; then SLOT="evening"; fi
            echo "sent:$(date +%Y-%m-%d):${SLOT}" >> email_sent.txt
            git add email_sent.txt
            git commit -m "chore: 记录邮件发送时段 [skip ci]" || true
            git push || true
            echo "📧 已记录邮件发送: $(date +%Y-%m-%d) / ${SLOT}"
          fi
