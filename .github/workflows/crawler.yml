name: Get Hot News

on:
  schedule:
    # 每小时第 5 分：爬取并刷新 GitHub Pages 实时热榜。
    # 同时承担「每日邮件」职责——每天北京时间首班会发送一封每日汇总
    # （通过 email_sent_date.txt 做日期节流，避免一天 24 封；且不依赖额外的邮件 cron）。
    - cron: "5 * * * *"

  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      # --------------------------------------------------------------------------------
      # 🚦 TRAFFIC CONTROL / 流量控制
      # --------------------------------------------------------------------------------
      # EN: Generates a random delay between 1 and 300 seconds (5 minutes).
      #     Critical for load balancing.
      #
      # CN: 生成 1 到 300 秒（5分钟）之间的随机延迟。
      #     这对负载均衡至关重要。
      - name: Random Delay (Traffic Control)
        if: success()
        run: |
          echo "🎲 Traffic Control: Generating random delay..."
          DELAY=$(( ( RANDOM % 300 )  + 1 ))
          echo "⏸️  Sleeping for ${DELAY} seconds to spread the load..."
          sleep ${DELAY}s
          echo "▶️  Delay finished. Starting crawler..."

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        if: success()
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      # --------------------------------------------------------------------------------
      # 🕘 按调度时间切换报告模式与通知开关
      #     - 手动触发 (workflow_dispatch) -> daily + 发邮件（便于验证）
      #     - 每小时定时 -> 每天北京时间「首班」发 daily 邮件；当天后续班次仅刷新 Pages
      #     （日期节流：email_sent_date.txt 记录上次发送日期，跨运行持久化）
      #
      #  通知控制策略（针对 TrendRadar v2.4.0）：
      #    程序是否发邮件，取决于 EMAIL_FROM/PASSWORD/TO 三个环境变量是否非空。
      #    因此本步骤把「本次是否该发」写入 $GITHUB_ENV 的 NOTIFY，
      #    仅当 NOTIFY=true 时，Run crawler 步才 export 邮件凭据 —— 实现真正的每日一封。
      # --------------------------------------------------------------------------------
      - name: 根据调度设置推送模式
        id: setmode
        if: success()
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          TZ=Asia/Shanghai
          TODAY=$(date +%Y-%m-%d)
          LAST=$(cat email_sent_date.txt 2>/dev/null || echo "")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发：总是发送，便于验证
            MODE="daily"; NOTIFY="true"
          elif [ "$TODAY" != "$LAST" ]; then
            # 当天首班：发送每日汇总
            MODE="daily"; NOTIFY="true"
          else
            # 当天后续班次：仅刷新热榜，不发邮件
            MODE="incremental"; NOTIFY="false"
          fi
          echo "调度表达式: $SCHEDULE"
          echo "今天日期(北京): $TODAY | 上次发送: ${LAST:-无}"
          echo "报告模式: $MODE | 通知: $NOTIFY"
          sed -i "s/^\(  mode: \).*/\1\"$MODE\"/" config/config.yaml
          echo "--- 校验 config.yaml 关键字段 ---"
          grep -nE '^  mode:' config/config.yaml
          # 写入 GITHUB_OUTPUT（备用）与 GITHUB_ENV（跨 step 可靠传递）
          echo "notify=$NOTIFY" >> "$GITHUB_OUTPUT"
          echo "NOTIFY=$NOTIFY" >> "$GITHUB_ENV"

      - name: Run crawler
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STORAGE_BACKEND: auto
          LOCAL_RETENTION_DAYS: ${{ secrets.LOCAL_RETENTION_DAYS }}
          REMOTE_RETENTION_DAYS: ${{ secrets.REMOTE_RETENTION_DAYS }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: |
          # 仅在需要通知时注入邮件凭据，避免每小时班重复发送（每日一封）
          if [ "$NOTIFY" = "true" ]; then
            echo "📧 本次将发送邮件通知"
            export EMAIL_FROM="${{ secrets.EMAIL_FROM }}"
            export EMAIL_PASSWORD="${{ secrets.EMAIL_PASSWORD }}"
            export EMAIL_TO="${{ secrets.EMAIL_TO }}"
            export EMAIL_SMTP_SERVER="${{ secrets.EMAIL_SMTP_SERVER }}"
            export EMAIL_SMTP_PORT="${{ secrets.EMAIL_SMTP_PORT }}"
          else
            echo "ℹ️ 今日已发送过邮件，本次不重复发送"
          fi
          python -m trendradar

      # --------------------------------------------------------------------------------
      # 📄 提交 HTML 报告到仓库，供 GitHub Pages 展示实时热榜
      # --------------------------------------------------------------------------------
      - name: Commit report to repository
        if: success()
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          SRC=$(find output -maxdepth 1 -name "*.html" 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            echo "ℹ️ 未生成 HTML 报告，跳过提交"
            exit 0
          fi
          cp "$SRC" index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "ℹ️ 报告无变化，跳过提交"
          else
            git commit -m "chore: 更新每日热点报告 [skip ci]"
            git push
            echo "✅ 已更新 index.html，GitHub Pages 将在 1-2 分钟内刷新"
          fi
          # 若本次发送了邮件，记录今日日期，避免当天重复发送
          if [ "$NOTIFY" = "true" ]; then
            TZ=Asia/Shanghai
            date +%Y-%m-%d > email_sent_date.txt
            git add email_sent_date.txt
            git commit -m "chore: 记录每日邮件发送日期 [skip ci]" || true
            git push || true
            echo "📧 已记录今日邮件发送: $(date +%Y-%m-%d)"
          fi
